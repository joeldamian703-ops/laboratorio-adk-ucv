name: Pruebas y análisis de calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pytest, cobertura y SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        run: python -m pip install poetry

      - name: Instalar dependencias
        run: poetry install --no-root

      - name: Ejecutar pruebas y cobertura
        run: poetry run pytest -v --cov=agente_ucv --cov-report=term-missing --cov-report=xml

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}