[project]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Agente academico con Google ADK"
authors = [
    {name = "Sirlopu Joel",email = "joeldamian703@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-adk (>=2.13.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
